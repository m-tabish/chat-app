<!DOCTYPE html>
<html>
<head>
    <title>WS Room Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        #output {
            border: 1px solid #ccc;
            height: 300px;
            width: 400px;
            overflow-y: scroll;
            padding: 10px;
            font-family: monospace;
            background: #f9f9f9;
        }
        .message {
            margin: 5px 0;
        }
        .sent {
            color: blue;
        }
        .received {
            color: green;
        }
    </style>
</head>
<body>

<h3>WebSocket Room Test</h3>

<input id="roomId" placeholder="roomId" />
<input id="senderId" placeholder="senderId" />
<input id="message" placeholder="message" />
<button onclick="connect()">Connect</button>
<button onclick="send()">Send</button>

<div id="output"></div>

<script>
    let stompClient = null;

    function connect() {
        const socket = new SockJS('http://localhost:8080/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            const roomId = document.getElementById("roomId").value;

            stompClient.subscribe(`/topic/room/${roomId}`, function (msg) {
                const data = JSON.parse(msg.body);
                const output = document.getElementById("output");

                // Avoid duplicate display for own sent message
                if (data.senderId !== document.getElementById("senderId").value) {
                    const div = document.createElement("div");
                    div.className = "message received";
                    div.innerText = `${data.senderId}: ${data.content}`;
                    output.appendChild(div);
                    output.scrollTop = output.scrollHeight;
                }
            });

            alert("Connected to room " + roomId);
        });
    }

    function send() {
        const roomId = document.getElementById("roomId").value;
        const senderId = document.getElementById("senderId").value;
        const content = document.getElementById("message").value;

        const messageData = {
            roomId: roomId,
            senderId: senderId,
            content: content,
            messageType: "CHAT"
        };

        stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(messageData));

        // Show sent message immediately
        const output = document.getElementById("output");
        const div = document.createElement("div");
        div.className = "message sent";
        div.innerText = `${senderId}: ${content}`;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;

        // Clear input box
        document.getElementById("message").value = "";
    }
</script>

</body>
</html>
